<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MC Configs — магазин конфигураций Minecraft</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f1;--card:#fff;--text:#1a1f1a;--muted:#667066;--accent:#3fa34d;--accent2:#2d7a38;--border:#d9dfd6;--warn:#fff3d6;--warnb:#e0a82e;--warnt:#6b4a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101410;--card:#1a211a;--text:#e8efe6;--muted:#92a091;--accent:#4cc25c;--accent2:#6fdc7e;--border:#2c372c;--warn:#3a2f10;--warnb:#c99a2e;--warnt:#ffd98a}}
:root[data-theme="dark"]{--bg:#101410;--card:#1a211a;--text:#e8efe6;--muted:#92a091;--accent:#4cc25c;--accent2:#6fdc7e;--border:#2c372c;--warn:#3a2f10;--warnb:#c99a2e;--warnt:#ffd98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:12px 0 24px}
header h1{margin:0;font-size:1.8rem;letter-spacing:-.02em}
header h1 span{color:var(--accent)}
header p{margin:6px 0 0;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:6px;border-radius:3px;background:var(--border);transition:background .3s}
.dot.on{background:var(--accent)}
.step{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step h2{margin:0 0 4px;font-size:1.1rem}
.step .num{color:var(--accent);font-weight:700}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:18px 10px;cursor:pointer;font-weight:600;font-size:1.05rem;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--accent2)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.warn{display:none;margin-top:12px;background:var(--warn);border:1px solid var(--warnb);color:var(--warnt);border-radius:12px;padding:12px 14px;font-size:.92rem}
.warn.show{display:block;animation:in .3s ease}
.step3 .box{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent2);border-radius:20px;padding:4px 12px;font-size:.85rem;font-weight:600}
.reset{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0}
.hidden{display:none}
.order{display:block;width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;background:var(--accent2);border:none;border-radius:12px;padding:14px;cursor:pointer}
.order:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⛏️ MC <span>Configs</span></h1>
    <p>Магазин конфигураций для Minecraft</p>
  </header>

  <div class="steps"><div class="dot on" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>

  <!-- ШАГ 1 -->
  <section class="step" id="s1">
    <h2><span class="num">Шаг 1.</span> Версия Minecraft</h2>
    <p class="hint">Выберите платформу, на которой вы играете</p>
    <div class="opts">
      <button class="opt" data-v="java">Java<small>Edition</small></button>
      <button class="opt" data-v="bedrock">Bedrock<small>Edition</small></button>
    </div>
    <div class="warn" id="warn">⚠️ Платформа <b>Java</b> временно не поддерживается. Мы автоматически переключили ваш выбор на <b>Bedrock</b>.</div>
  </section>

  <!-- ШАГ 2 -->
  <section class="step hidden" id="s2">
    <h2><span class="num">Шаг 2.</span> Мод / клиент</h2>
    <p class="hint">С какого мода вы играете?</p>
    <div class="opts">
      <button class="opt" data-m="proto">Proto</button>
      <button class="opt" data-m="apollon">Apollon</button>
    </div>
  </section>

  <!-- ШАГ 3 -->
  <section class="step step3 hidden" id="s3">
    <h2><span class="num">Шаг 3.</span> <span id="s3title"></span></h2>
    <div class="summary" id="sum"></div>
    <div class="box" id="s3body"></div>
    <button class="order" id="order">📩 Заказать</button>
  </section>

  <button class="reset hidden" id="reset">↺ Начать заново</button>
</div>

<script>
/* ===== СЮДА ВПИСЫВАЕТЕ СОДЕРЖИМОЕ 3 КАТЕГОРИИ =====
   title — заголовок шага 3, html — любое содержимое (текст, карточки, цены, кнопки). */
const STEP3 = {
  proto:   { title: 'Конфигурации для Proto',   html: 'Здесь будет содержимое для Proto' },
  apollon: { title: 'Конфигурации для Apollon', html: 'Здесь будет содержимое для Apollon' }
};

const NAMES = {bedrock:'Bedrock', proto:'Proto', apollon:'Apollon'};
const $ = id => document.getElementById(id);
const state = {version:null, mod:null};

function mark(sel, attr, val){
  document.querySelectorAll(sel).forEach(b => b.classList.toggle('sel', b.dataset[attr] === val));
}

document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  const v = b.dataset.v;
  const isJava = v === 'java';
  // Java пока не поддерживается — подсветим Java на мгновение, затем переключим на Bedrock
  $('warn').classList.toggle('show', isJava);
  mark('[data-v]', 'v', v);
  if (isJava) setTimeout(() => { mark('[data-v]', 'v', 'bedrock'); }, 700);
  state.version = 'bedrock';
  $('s2').classList.remove('hidden');
  $('d2').classList.add('on');
  $('reset').classList.remove('hidden');
  if (state.mod) render3();
  $('s2').scrollIntoView({behavior:'smooth', block:'nearest'});
});

document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
  state.mod = b.dataset.m;
  mark('[data-m]', 'm', state.mod);
  render3();
});

function render3(){
  const d = STEP3[state.mod];
  $('s3title').textContent = d.title;
  $('sum').innerHTML = [state.version, state.mod].map(k => '<span class="tag">'+NAMES[k]+'</span>').join('');
  $('s3body').innerHTML = d.html;
  $('s3').classList.remove('hidden');
  $('d3').classList.add('on');
  $('s3').style.animation='none'; void $('s3').offsetWidth; $('s3').style.animation='';
  $('s3').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* Telegram Mini App */
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// state.config можно задавать на шаге 3 (например, название выбранной конфигурации)
$('order').onclick = () => {
  const data = {version: state.version, mod: state.mod, config: state.config || null};
  if (tg && tg.initData) { tg.sendData(JSON.stringify(data)); }
  else { alert('Откройте магазин через Telegram-бота, чтобы оформить заказ.\n\n' + JSON.stringify(data)); }
};

$('reset').onclick = () => {
  state.version = state.mod = null;
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
  ['s2','s3','reset'].forEach(i => $(i).classList.add('hidden'));
  $('warn').classList.remove('show');
  $('d2').classList.remove('on'); $('d3').classList.remove('on');
  window.scrollTo({top:0, behavior:'smooth'});
};
</script>
</body>
</html>
